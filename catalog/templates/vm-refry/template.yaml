apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: vm-refry
  title: Re-run a fry stage
  description: Apply one configuration stage to an existing team VM.
spec:
  owner: group:default/platform-admins
  presentation:
    buttonLabels:
      createButtonText: Refry VM
  type: infrastructure
  parameters:
    - title: VM and stage
      required: [vm, stage]
      properties:
        vm:
          title: VM
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Resource
              spec.type: vm
            defaultKind: Resource
            allowArbitraryValues: false
        stage:
          title: Fry stage
          type: string
          enum: [baseline, software, ad-join, access]
          default: software
        software:
          title: Software to add (software refry; already-installed software is kept)
          type: array
          default: []
          uniqueItems: true
          items:
            type: string
            enum: [git, htop, nginx, docker]
          ui:widget: checkboxes
  steps:
    - id: run
      name: Start refry run
      action: cf:vm:run
      input:
        operation: refry
        vm: ${{ parameters.vm }}
        stage: ${{ parameters.stage }}
        software: ${{ parameters.software }}
  output:
    links:
      - title: Follow run
        url: ${{ steps.run.output.runUrl }}

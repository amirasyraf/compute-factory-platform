apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: vm-modify
  title: Modify a VM
  description: Change a team VM's size, software or AD join. Open it from the VM page, which fills in the current configuration.
spec:
  owner: group:default/platform-admins
  presentation:
    buttonLabels:
      createButtonText: Apply changes
  type: infrastructure
  parameters:
    - title: Desired Configuration
      description: >-
        The form shows the VM's current configuration. Changing the size restarts the VM (on AWS its
        public IP changes; Azure keeps its static IP). Unchecked software is uninstalled; its data and configuration files are kept.
      required: [vm, compute, configuration]
      properties:
        vm:
          title: VM
          type: string
          ui:field: EntityPicker
          ui:disabled: true
          ui:options:
            catalogFilter:
              kind: Resource
              spec.type: vm
            defaultKind: Resource
            allowArbitraryValues: false
        compute:
          title: Size
          type: object
          additionalProperties: false
          required: [platform, os]
          # Same IDP field as vm-request; prefilled with the current size or instance type.
          # Platform and image are shown but cannot be changed.
          ui:field: VmComputePicker
          ui:options:
            locked: true
          properties:
            platform:
              title: Platform
              type: string
              enum: [aws, azure]
            os:
              title: Operating System
              type: string
              pattern: '^[a-z][a-z0-9-]{0,31}$'
            imageVersion:
              title: Image Version
              type: string
              pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$'
            size:
              title: Size
              type: string
              enum: [XS, S, M, L]
            instanceType:
              title: Instance Type
              type: string
              # AWS (m7i.large) or Azure (Standard_D2s_v6); the platform's platform.json pattern is authoritative.
              pattern: '^([a-z][a-z0-9-]*\.[a-z0-9]+|Standard_[A-Za-z0-9_]{2,60})$'
        configuration:
          title: Configuration
          type: object
          additionalProperties: false
          required: [software, adJoin]
          properties:
            software:
              title: Software
              type: array
              default: []
              uniqueItems: true
              maxItems: 20
              items:
                type: string
                pattern: '^[a-z0-9][a-z0-9-]{0,40}$'
              # IDP field: checkboxes for the platform repo's ansible/software-catalog.json entries
              # offered for the chosen OS family; spec.py and the IDP reject anything else.
              ui:field: VmSoftwarePicker
            adJoin:
              title: Join AD (mock)
              type: boolean
              default: false
  steps:
    - id: run
      name: Start modify run
      action: cf:vm:run
      input:
        operation: modify
        vm: ${{ parameters.vm }}
        compute: ${{ parameters.compute }}
        software: ${{ parameters.configuration.software }}
        adJoin: ${{ parameters.configuration.adJoin }}
  output:
    links:
      - title: Follow run
        url: ${{ steps.run.output.runUrl }}

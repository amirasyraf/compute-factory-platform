apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: vm-destroy
  title: Destroy a VM
  description: Destroy a VM and remove its inventory and catalog entity.
spec:
  owner: group:default/platform-admins
  presentation:
    buttonLabels:
      createButtonText: Destroy VM
  type: infrastructure
  parameters:
    - title: Select a VM to destroy
      required: [vm]
      properties:
        vm:
          title: VM
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Resource
              spec.type: vm
            defaultKind: Resource
            allowArbitraryValues: false
  steps:
    - id: run
      name: Start destroy run
      action: cf:vm:run
      input:
        operation: destroy
        vm: ${{ parameters.vm }}
  output:
    links:
      - title: Follow run
        url: ${{ steps.run.output.runUrl }}

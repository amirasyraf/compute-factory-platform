apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: vm-request
  title: Request a VM
  description: Provision a team-owned VM and apply the selected fry stages.
spec:
  owner: group:default/platform-admins
  presentation:
    buttonLabels:
      createButtonText: Request VM
  type: infrastructure
  parameters:
    - title: VM request
      required: [name, team, compute, configuration]
      properties:
        name:
          title: VM name
          type: string
          pattern: '^[a-z][a-z0-9-]{2,20}$'
          description: Unique lowercase name, 3–21 characters.
        team:
          title: Owning team
          type: string
          ui:field: MyGroupsPicker
        compute:
          title: Compute
          type: object
          additionalProperties: false
          required: [platform, os, size]
          properties:
            platform:
              title: Platform
              type: string
              default: aws
              enum: [aws]
            os:
              title: Operating system
              type: string
              default: ubuntu
              enum: [ubuntu]
            size:
              title: Size
              type: string
              default: S
              enum: [S, M, L]
        configuration:
          title: Configuration
          type: object
          additionalProperties: false
          required: [software, adJoin]
          properties:
            software:
              title: Software
              type: array
              default: []
              uniqueItems: true
              items:
                type: string
                enum: [git, htop, nginx, docker]
              ui:widget: checkboxes
            adJoin:
              title: Join AD (mock)
              type: boolean
              default: false
        billing:
          title: Billing metadata (optional, self-reported)
          description: Informational AWS tags, not billing authorization. Do not enter secrets.
          type: object
          additionalProperties: false
          default: {}
          properties:
            costCenter:
              title: Cost center
              type: string
              minLength: 1
              maxLength: 256
            projectCode:
              title: Project code
              type: string
              minLength: 1
              maxLength: 256
        cloudTags:
          title: Additional AWS tags (optional)
          description: 'Up to 40 string tags. Name and cf:/aws:/billing: prefixes are reserved. No secrets.'
          type: object
          default: {}
          maxProperties: 40
          propertyNames:
            maxLength: 128
            minLength: 1
          additionalProperties:
            type: string
            maxLength: 256
  steps:
    - id: servicenow
      name: Create ServiceNow request (mock)
      action: cf:servicenow:create
      input:
        vmName: ${{ parameters.name }}
        team: ${{ parameters.team }}
        platform: ${{ parameters.compute.platform }}
        os: ${{ parameters.compute.os }}
        size: ${{ parameters.compute.size }}
    - id: dispatch
      name: Start VM pipeline
      action: github:actions:dispatch
      input:
        repoUrl: github.com?owner=amirasyraf&repo=compute-factory-platform
        workflowId: provision.yml
        branchOrTagName: main
        returnWorkflowRunDetails: true
        workflowInputs:
          name: ${{ parameters.name }}
          spec_json: >-
            {"type":"vm","owner":${{ parameters.team | dump }},"lifecycle":"poc",
            "compute":${{ parameters.compute | dump }},"configuration":${{ parameters.configuration | dump }},
            "billing":${{ parameters.billing | default({}) | dump }},"cloudTags":${{ parameters.cloudTags | default({}) | dump }}}
          requested_by: ${{ user.entity.metadata.name }}
          requester_teams: ${{ user.entity.spec.memberOf | join(',') }}
    - id: monitor
      name: Monitor VM workflow
      action: cf:watch-workflow
      input:
        operation: provision
        workflowRunId: ${{ steps.dispatch.output.workflowRunId }}
  output:
    text:
      - title: ServiceNow request (mock)
        content: >-
          Created **${{ steps.servicenow.output.number }}** via REST
          (HTTP ${{ steps.servicenow.output.httpStatus }}). Demo only; no real ServiceNow ticket exists.
    links:
      - title: Open VM in catalog
        entityRef: resource:default/${{ parameters.name }}
      - title: Pipeline run
        url: ${{ steps.dispatch.output.workflowRunHtmlUrl }}

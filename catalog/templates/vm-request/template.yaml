apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: vm-request
  title: Request a VM
  description: Provision a team-owned VM and apply the selected fry stages.
spec:
  owner: group:default/platform-admins
  presentation:
    buttonLabels:
      createButtonText: Request VM
  type: infrastructure
  parameters:
    - title: VM request
      required: [name, team, compute, configuration, tags]
      properties:
        name:
          title: VM name
          type: string
          pattern: '^[a-z][a-z0-9-]{2,20}$'
          description: Unique lowercase name, 3–21 characters.
        team:
          title: Owning team
          type: string
          ui:field: MyGroupsPicker
        compute:
          title: Compute
          type: object
          additionalProperties: false
          required: [platform, os]
          # IDP field: size cards (XS-L) with live AWS specs, plus an "Advanced" instance-type
          # picker. It submits exactly one of size or instanceType.
          ui:field: VmComputePicker
          properties:
            platform:
              title: Platform
              type: string
              default: aws
              enum: [aws]
            os:
              title: Operating system
              type: string
              default: ubuntu
              enum: [ubuntu]
            size:
              title: Size
              type: string
              # No schema default: the form would re-add it beside an advanced instanceType.
              # VmComputePicker preselects S instead.
              enum: [XS, S, M, L]
            instanceType:
              title: Instance type
              type: string
              pattern: '^[a-z][a-z0-9-]*\.[a-z0-9]+$'
        configuration:
          title: Configuration
          type: object
          additionalProperties: false
          required: [software, adJoin]
          properties:
            software:
              title: Software
              type: array
              default: []
              uniqueItems: true
              items:
                type: string
                enum: [git, htop, nginx, docker]
              ui:widget: checkboxes
            adJoin:
              title: Join AD (mock)
              type: boolean
              default: false
        tags:
          title: Tags
          description: AWS tags on the VM. cost_center and project_code are required and self-reported (not billing authorization). Do not enter secrets.
          type: object
          additionalProperties: false
          required: [costCenter, projectCode]
          # IDP field: one key/value table; fixed cost_center/project_code rows plus optional tags.
          ui:field: VmTagsEditor
          properties:
            costCenter:
              title: cost_center
              type: string
              minLength: 1
              maxLength: 256
            projectCode:
              title: project_code
              type: string
              minLength: 1
              maxLength: 256
            extra:
              title: Additional tags
              type: object
              default: {}
              maxProperties: 40
              propertyNames:
                maxLength: 128
                minLength: 1
              additionalProperties:
                type: string
                maxLength: 256
  steps:
    - id: servicenow
      name: Create ServiceNow request (mock)
      action: cf:servicenow:create
      input:
        vmName: ${{ parameters.name }}
        team: ${{ parameters.team }}
        platform: ${{ parameters.compute.platform }}
        os: ${{ parameters.compute.os }}
        size: ${{ parameters.compute.instanceType or parameters.compute.size }}
    - id: dispatch
      name: Start provisioning run
      action: cf:vm:dispatch
      input:
        name: ${{ parameters.name }}
        specJson: >-
          {"type":"vm","owner":${{ parameters.team | dump }},"lifecycle":"poc",
          "compute":${{ parameters.compute | dump }},"configuration":${{ parameters.configuration | dump }},
          "billing":{"costCenter":${{ parameters.tags.costCenter | dump }},"projectCode":${{ parameters.tags.projectCode | dump }}},
          "cloudTags":${{ parameters.tags.extra | default({}) | dump }}}
  output:
    text:
      - title: ServiceNow request (mock)
        content: >-
          Created **${{ steps.servicenow.output.number }}** via REST
          (HTTP ${{ steps.servicenow.output.httpStatus }}). Demo only; no real ServiceNow ticket exists.
    links:
      - title: Follow provisioning
        url: ${{ steps.dispatch.output.runUrl }}
      - title: Open VM in catalog
        entityRef: resource:default/${{ parameters.name }}

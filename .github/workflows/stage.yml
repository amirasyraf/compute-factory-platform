name: VM stage
run-name: "stage ${{ inputs.stage }} ${{ inputs.name }} by ${{ inputs.requested_by }} [${{ inputs.run_key }}]"
on:
  workflow_dispatch:
    inputs:
      stage:
        type: string
        required: true
      name:
        type: string
        required: true
      request_id:
        type: string
        required: true
      run_key:
        type: string
        required: true
      requested_by:
        type: string
        required: true
      requester_teams:
        type: string
        required: true
      params_json:
        type: string
        required: false
        default: '{}'
concurrency:
  group: vm-${{ inputs.name }}
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
jobs:
  stage:
    if: vars.CF_POC_MAINTENANCE != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NAME: ${{ inputs.name }}
      STAGE: ${{ inputs.stage }}
      REQUEST_ID: ${{ inputs.request_id }}
      RUN_KEY: ${{ inputs.run_key }}
      REQUESTED_BY: ${{ inputs.requested_by }}
      REQUESTER_TEAMS: ${{ inputs.requester_teams }}
      PARAMS_JSON: ${{ inputs.params_json }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      BACKSTAGE_URL: ${{ vars.BACKSTAGE_URL }}
      BACKSTAGE_TOKEN: ${{ secrets.BACKSTAGE_TOKEN }}
      # Azure (OIDC, no secret): Terraform azurerm reads ARM_*, the az CLI logs in below.
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      INVENTORY_ROOT: ${{ github.workspace }}/.current-inventory
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Load current inventory
        uses: actions/checkout@v4
        with:
          ref: main
          path: .current-inventory
      - name: Validate inputs
        id: validate
        run: bash scripts/validate.sh
      - name: Register inventory
        if: inputs.stage == 'register' && steps.validate.outputs.noop != 'true'
        run: bash scripts/inventory.sh register
        env:
          SPEC_JSON: ${{ steps.validate.outputs.spec_json }}
      - name: Persist configuration
        if: inputs.stage == 'configure' && steps.validate.outputs.noop != 'true'
        run: bash scripts/inventory.sh configure
        env:
          SPEC_JSON: ${{ steps.validate.outputs.spec_json }}
      - name: Finalize inventory
        if: inputs.stage == 'finalize' && steps.validate.outputs.noop != 'true'
        run: bash scripts/inventory.sh finalize
        env:
          OUTCOME: ${{ steps.validate.outputs.outcome }}
      - name: Check cleanup eligibility
        id: cleanup
        if: inputs.stage == 'destroy' && steps.validate.outputs.noop != 'true'
        run: bash scripts/demo-guard.sh
        env:
          DEMO_GENERATION: ${{ steps.validate.outputs.demo_generation }}
          EXPECTED_REQUEST_ID: ${{ inputs.request_id }}
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.validate.outputs.noop != 'true' && (inputs.stage == 'provision' || (inputs.stage == 'destroy' && steps.cleanup.outputs.proceed == 'true') || contains(fromJSON('["baseline","software","ad-join","access","start","stop","reboot","os-update"]'), inputs.stage))
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # AWS above is always the shared base (SSH CA, Terraform state); the VM's own cloud is added here.
      - uses: azure/login@v3
        if: steps.validate.outputs.platform == 'azure' && (inputs.stage == 'provision' || (inputs.stage == 'destroy' && steps.cleanup.outputs.proceed == 'true') || contains(fromJSON('["start","stop","reboot"]'), inputs.stage))
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        if: steps.validate.outputs.noop != 'true' && (inputs.stage == 'provision' || (inputs.stage == 'destroy' && steps.cleanup.outputs.proceed == 'true'))
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Provision VM
        if: inputs.stage == 'provision' && steps.validate.outputs.noop != 'true'
        run: bash scripts/terraform.sh apply
      - name: Destroy VM
        if: inputs.stage == 'destroy' && steps.validate.outputs.noop != 'true' && steps.cleanup.outputs.proceed == 'true'
        run: |
          bash scripts/demo-guard.sh
          if [[ "$(tail -1 "$GITHUB_OUTPUT")" == proceed=true ]]; then
            bash scripts/terraform.sh destroy
          fi
        env:
          DEMO_GENERATION: ${{ steps.validate.outputs.demo_generation }}
          EXPECTED_REQUEST_ID: ${{ inputs.request_id }}
      - name: Change power state
        if: contains(fromJSON('["start","stop","reboot"]'), inputs.stage) && steps.validate.outputs.noop != 'true'
        env:
          INSTANCE_ID: ${{ steps.validate.outputs.instance_id }}
          PLATFORM: ${{ steps.validate.outputs.platform }}
          SSH_USER: ${{ steps.validate.outputs.ssh_user }}
        run: bash scripts/power.sh "$STAGE"
      - name: Run playbook
        if: contains(fromJSON('["baseline","software","ad-join","access","os-update"]'), inputs.stage) && steps.validate.outputs.noop != 'true'
        env:
          HOST: ${{ steps.validate.outputs.host }}
          SSH_USER: ${{ steps.validate.outputs.ssh_user }}
          VARS_JSON: ${{ steps.validate.outputs.vars_json }}
        run: |
          # Fry stages apply desired configuration; OS updates are maintenance and keep cf/status.
          playbook="ansible/fry/$STAGE.yml"
          if [[ "$STAGE" == os-update ]]; then
            playbook=ansible/maintain/os-update.yml
          else
            STATUS=frying bash scripts/inventory.sh update
          fi
          pip install -r requirements-ansible.txt
          bash scripts/ssh-ca.sh "$RUNNER_TEMP/cf-key"
          bash scripts/wait-for-ssh.sh "$HOST" "$SSH_USER" "$RUNNER_TEMP/cf-key"
          printf '%s\n' "$VARS_JSON" > "$RUNNER_TEMP/cf-vars.json"
          ansible-playbook -i "$HOST," -u "$SSH_USER" \
            --private-key "$RUNNER_TEMP/cf-key" \
            --ssh-common-args "-o CertificateFile=$RUNNER_TEMP/cf-key-cert.pub -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            "$playbook" -e "@$RUNNER_TEMP/cf-vars.json"
      - name: Remove ephemeral identity
        if: always()
        run: rm -f "$RUNNER_TEMP/cf-key" "$RUNNER_TEMP/cf-key.pub" "$RUNNER_TEMP/cf-key-cert.pub" "$RUNNER_TEMP/cf-vars.json"

name: provision
run-name: "provision ${{ inputs.name }} by ${{ inputs.requested_by }}"
on:
  workflow_dispatch:
    inputs:
      name:
        type: string
        required: true
      team:
        type: string
        required: true
      platform:
        type: string
        default: aws
        required: true
      os:
        type: string
        default: ubuntu
        required: true
      size:
        type: string
        default: S
        required: true
      software:
        type: string
        default: ''
      ad_join:
        type: string
        default: 'false'
        required: true
      requested_by:
        type: string
        required: true
      requester_teams:
        type: string
        required: true
concurrency:
  group: vm-${{ inputs.name }}
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
env:
  NAME: ${{ inputs.name }}
  TEAM: ${{ inputs.team }}
  PLATFORM: ${{ inputs.platform }}
  OS: ${{ inputs.os }}
  SIZE: ${{ inputs.size }}
  SOFTWARE: ${{ inputs.software }}
  AD_JOIN: ${{ inputs.ad_join }}
  REQUESTED_BY: ${{ inputs.requested_by }}
  REQUESTER_TEAMS: ${{ inputs.requester_teams }}
  BACKSTAGE_URL: ${{ vars.BACKSTAGE_URL }}
  BACKSTAGE_TOKEN: ${{ secrets.BACKSTAGE_TOKEN }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  AWS_REGION: ${{ vars.AWS_REGION }}
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      team: ${{ steps.validate.outputs.team }}
      vars_json: ${{ steps.validate.outputs.vars_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: validate
        run: bash scripts/validate.sh provision
  register:
    needs: validate
    runs-on: ubuntu-latest
    env:
      TEAM: ${{ needs.validate.outputs.team }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: bash scripts/inventory.sh register
  provision:
    needs: [validate, register]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEAM: ${{ needs.validate.outputs.team }}
    outputs:
      host: ${{ steps.apply.outputs.host }}
      ssh_user: ${{ steps.apply.outputs.ssh_user }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - id: apply
        run: bash scripts/terraform.sh apply
  fry-baseline:
    needs: [validate, provision]
    uses: ./.github/workflows/_fry-stage.yml
    with:
      name: ${{ inputs.name }}
      stage: baseline
      host: ${{ needs.provision.outputs.host }}
      ssh_user: ${{ needs.provision.outputs.ssh_user }}
      os: ${{ inputs.os }}
      vars_json: ${{ needs.validate.outputs.vars_json }}
    secrets: inherit
  fry-software:
    needs: [validate, provision, fry-baseline]
    if: inputs.software != ''
    uses: ./.github/workflows/_fry-stage.yml
    with:
      name: ${{ inputs.name }}
      stage: software
      host: ${{ needs.provision.outputs.host }}
      ssh_user: ${{ needs.provision.outputs.ssh_user }}
      os: ${{ inputs.os }}
      vars_json: ${{ needs.validate.outputs.vars_json }}
    secrets: inherit
  fry-ad-join:
    needs: [validate, provision, fry-baseline, fry-software]
    if: >-
      always() && !cancelled() && inputs.ad_join == 'true' &&
      needs.fry-baseline.result == 'success' &&
      (needs.fry-software.result == 'success' || needs.fry-software.result == 'skipped')
    uses: ./.github/workflows/_fry-stage.yml
    with:
      name: ${{ inputs.name }}
      stage: ad-join
      host: ${{ needs.provision.outputs.host }}
      ssh_user: ${{ needs.provision.outputs.ssh_user }}
      os: ${{ inputs.os }}
      vars_json: ${{ needs.validate.outputs.vars_json }}
    secrets: inherit
  fry-access:
    needs: [validate, provision, fry-baseline, fry-software, fry-ad-join]
    if: >-
      always() && !cancelled() && needs.fry-baseline.result == 'success' &&
      (needs.fry-software.result == 'success' || needs.fry-software.result == 'skipped') &&
      (needs.fry-ad-join.result == 'success' || needs.fry-ad-join.result == 'skipped')
    uses: ./.github/workflows/_fry-stage.yml
    with:
      name: ${{ inputs.name }}
      stage: access
      host: ${{ needs.provision.outputs.host }}
      ssh_user: ${{ needs.provision.outputs.ssh_user }}
      os: ${{ inputs.os }}
      vars_json: ${{ needs.validate.outputs.vars_json }}
    secrets: inherit
  finalize:
    needs: [fry-access]
    if: always() && needs.fry-access.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: bash scripts/inventory.sh update
        env:
          STATUS: ready
  on-failure:
    needs: [validate, register, provision, fry-baseline, fry-software, fry-ad-join, fry-access, finalize]
    if: failure() && needs.register.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: bash scripts/inventory.sh failure

name: provision
run-name: "provision ${{ inputs.name }} by ${{ inputs.requested_by }} [${{ inputs.request_id }}]"
on:
  workflow_dispatch:
    inputs:
      name:
        type: string
        required: true
      spec_json:
        description: Desired Resource spec as JSON (compute, configuration, optional billing and cloudTags)
        type: string
        required: true
      requested_by:
        type: string
        required: true
      requester_teams:
        type: string
        required: true
      request_id:
        description: Stable IDP request identity (optional for trusted manual dispatch)
        type: string
        required: false
concurrency:
  group: vm-${{ inputs.name }}
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
env:
  NAME: ${{ inputs.name }}
  SPEC_JSON: ${{ inputs.spec_json }}
  REQUESTED_BY: ${{ inputs.requested_by }}
  REQUESTER_TEAMS: ${{ inputs.requester_teams }}
  REQUEST_ID: ${{ inputs.request_id }}
  BACKSTAGE_URL: ${{ vars.BACKSTAGE_URL }}
  BACKSTAGE_TOKEN: ${{ secrets.BACKSTAGE_TOKEN }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  AWS_REGION: ${{ vars.AWS_REGION }}
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      team: ${{ steps.validate.outputs.team }}
      vars_json: ${{ steps.validate.outputs.vars_json }}
      spec_json: ${{ steps.validate.outputs.spec_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: validate
        run: bash scripts/validate.sh provision
  register:
    needs: validate
    runs-on: ubuntu-latest
    env:
      SPEC_JSON: ${{ needs.validate.outputs.spec_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: bash scripts/inventory.sh register
  provision:
    needs: [validate, register]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      host: ${{ steps.apply.outputs.host }}
      ssh_user: ${{ steps.apply.outputs.ssh_user }}
      os: ${{ steps.apply.outputs.os }}
      software: ${{ steps.apply.outputs.software }}
      ad_join: ${{ steps.apply.outputs.ad_join }}
      vars_json: ${{ steps.apply.outputs.vars_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - id: apply
        run: bash scripts/terraform.sh apply
  fry-baseline:
    needs: [validate, provision]
    uses: ./.github/workflows/_fry-stage.yml
    with:
      name: ${{ inputs.name }}
      stage: baseline
      host: ${{ needs.provision.outputs.host }}
      ssh_user: ${{ needs.provision.outputs.ssh_user }}
      os: ${{ needs.provision.outputs.os }}
      vars_json: ${{ needs.provision.outputs.vars_json }}
    secrets: inherit
  fry-software:
    needs: [validate, provision, fry-baseline]
    if: needs.provision.outputs.software != '[]'
    uses: ./.github/workflows/_fry-stage.yml
    with:
      name: ${{ inputs.name }}
      stage: software
      host: ${{ needs.provision.outputs.host }}
      ssh_user: ${{ needs.provision.outputs.ssh_user }}
      os: ${{ needs.provision.outputs.os }}
      vars_json: ${{ needs.provision.outputs.vars_json }}
    secrets: inherit
  fry-ad-join:
    needs: [validate, provision, fry-baseline, fry-software]
    if: >-
      always() && !cancelled() && needs.provision.outputs.ad_join == 'true' &&
      needs.fry-baseline.result == 'success' &&
      (needs.fry-software.result == 'success' || needs.fry-software.result == 'skipped')
    uses: ./.github/workflows/_fry-stage.yml
    with:
      name: ${{ inputs.name }}
      stage: ad-join
      host: ${{ needs.provision.outputs.host }}
      ssh_user: ${{ needs.provision.outputs.ssh_user }}
      os: ${{ needs.provision.outputs.os }}
      vars_json: ${{ needs.provision.outputs.vars_json }}
    secrets: inherit
  fry-access:
    needs: [validate, provision, fry-baseline, fry-software, fry-ad-join]
    if: >-
      always() && !cancelled() && needs.fry-baseline.result == 'success' &&
      (needs.fry-software.result == 'success' || needs.fry-software.result == 'skipped') &&
      (needs.fry-ad-join.result == 'success' || needs.fry-ad-join.result == 'skipped')
    uses: ./.github/workflows/_fry-stage.yml
    with:
      name: ${{ inputs.name }}
      stage: access
      host: ${{ needs.provision.outputs.host }}
      ssh_user: ${{ needs.provision.outputs.ssh_user }}
      os: ${{ needs.provision.outputs.os }}
      vars_json: ${{ needs.provision.outputs.vars_json }}
    secrets: inherit
  finalize:
    needs: [fry-access]
    if: always() && needs.fry-access.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: bash scripts/inventory.sh update
        env:
          STATUS: ready
  on-failure:
    needs: [validate, register, provision, fry-baseline, fry-software, fry-ad-join, fry-access, finalize]
    if: failure() && needs.register.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: bash scripts/inventory.sh failure

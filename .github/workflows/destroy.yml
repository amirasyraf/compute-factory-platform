name: destroy
run-name: "destroy ${{ inputs.name }} by ${{ inputs.requested_by }} [${{ inputs.demo_generation }}:${{ inputs.expected_request_id }}]"
on:
  workflow_dispatch:
    inputs:
      name:
        type: string
        required: true
      requested_by:
        type: string
        required: true
      requester_teams:
        type: string
        required: true
      demo_generation:
        description: Automatic cleanup mode generation; omitted for manual destroy
        type: string
        required: false
      expected_request_id:
        description: VM incarnation identity for automatic cleanup
        type: string
        required: false
concurrency:
  group: vm-${{ inputs.name }}
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
env:
  NAME: ${{ inputs.name }}
  REQUESTED_BY: ${{ inputs.requested_by }}
  REQUESTER_TEAMS: ${{ inputs.requester_teams }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  BACKSTAGE_URL: ${{ vars.BACKSTAGE_URL }}
  BACKSTAGE_TOKEN: ${{ secrets.BACKSTAGE_TOKEN }}
  DEMO_GENERATION: ${{ inputs.demo_generation }}
  EXPECTED_REQUEST_ID: ${{ inputs.expected_request_id }}
jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.validate.outputs.platform }}
      proceed: ${{ steps.demo.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: demo
        run: bash scripts/demo-guard.sh
      - id: validate
        if: steps.demo.outputs.proceed == 'true'
        run: bash scripts/validate.sh existing
  destroy:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLATFORM: ${{ needs.guard.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - id: demo
        run: bash scripts/demo-guard.sh
      - if: steps.demo.outputs.proceed == 'true'
        run: bash scripts/inventory.sh update
        env:
          STATUS: destroying
      - if: steps.demo.outputs.proceed == 'true'
        run: bash scripts/terraform.sh destroy
      - if: failure() && steps.demo.outputs.proceed == 'true'
        run: bash scripts/inventory.sh failure

name: fry
run-name: "fry ${{ inputs.name }} by ${{ inputs.requested_by }}"
on:
  workflow_dispatch:
    inputs:
      name:
        type: string
        required: true
      stage:
        type: string
        required: true
      software:
        description: JSON software array; software refry adds it to spec.configuration.software
        type: string
        default: '[]'
      requested_by:
        type: string
        required: true
      requester_teams:
        type: string
        required: true
concurrency:
  group: vm-${{ inputs.name }}
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
env:
  NAME: ${{ inputs.name }}
  STAGE: ${{ inputs.stage }}
  SOFTWARE_INPUT: ${{ inputs.software }}
  REQUESTED_BY: ${{ inputs.requested_by }}
  REQUESTER_TEAMS: ${{ inputs.requester_teams }}
  BACKSTAGE_URL: ${{ vars.BACKSTAGE_URL }}
  BACKSTAGE_TOKEN: ${{ secrets.BACKSTAGE_TOKEN }}
jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.validate.outputs.host }}
      ssh_user: ${{ steps.validate.outputs.ssh_user }}
      os: ${{ steps.validate.outputs.os }}
      vars_json: ${{ steps.validate.outputs.vars_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: validate
        run: bash scripts/validate.sh existing
      - name: Persist desired configuration before applying it
        run: bash scripts/inventory.sh configure
        env:
          SPEC_JSON: ${{ steps.validate.outputs.spec_json }}
  fry:
    needs: guard
    uses: ./.github/workflows/_fry-stage.yml
    with:
      name: ${{ inputs.name }}
      stage: ${{ inputs.stage }}
      host: ${{ needs.guard.outputs.host }}
      ssh_user: ${{ needs.guard.outputs.ssh_user }}
      os: ${{ needs.guard.outputs.os }}
      vars_json: ${{ needs.guard.outputs.vars_json }}
    secrets: inherit
  finalize:
    needs: fry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore overall status
        run: |
          stages=$(yq -r '.metadata.annotations."cf/stages"' "vms/$NAME/catalog-info.yaml")
          if jq -e 'all(.[]; . == "success" or . == "skipped")' <<< "$stages"; then
            STATUS=ready bash scripts/inventory.sh update
          else
            STATUS=failed bash scripts/inventory.sh update
          fi

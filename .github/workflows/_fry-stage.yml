name: fry-stage
on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      stage:
        type: string
        required: true
      host:
        type: string
        required: true
      ssh_user:
        type: string
        required: true
      os:
        type: string
        required: true
      vars_json:
        type: string
        required: true
permissions:
  contents: write
  id-token: write
jobs:
  fry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NAME: ${{ inputs.name }}
      STAGE: ${{ inputs.stage }}
      HOST: ${{ inputs.host }}
      SSH_USER: ${{ inputs.ssh_user }}
      OS: ${{ inputs.os }}
      VARS_JSON: ${{ inputs.vars_json }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      BACKSTAGE_URL: ${{ vars.BACKSTAGE_URL }}
      BACKSTAGE_TOKEN: ${{ secrets.BACKSTAGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Mark running
        run: bash scripts/inventory.sh update
        env:
          STATUS: frying
          STAGE_STATUS: running
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Install Ansible
        run: pip install -r requirements-ansible.txt
      - name: Sign ephemeral key
        run: bash scripts/ssh-ca.sh "$RUNNER_TEMP/cf-key"
      - name: Wait for SSH
        run: bash scripts/wait-for-ssh.sh "$HOST" "$SSH_USER" "$RUNNER_TEMP/cf-key"
      - name: Run fry playbook
        run: |
          [[ "$STAGE" =~ ^(baseline|software|ad-join|access)$ && "$OS" == ubuntu ]]
          printf '%s\n' "$VARS_JSON" > "$RUNNER_TEMP/cf-vars.json"
          ansible-playbook -i "$HOST," -u "$SSH_USER" \
            --private-key "$RUNNER_TEMP/cf-key" \
            --ssh-common-args "-o CertificateFile=$RUNNER_TEMP/cf-key-cert.pub -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            "ansible/fry/$STAGE.yml" -e "@$RUNNER_TEMP/cf-vars.json"
      - name: Mark success
        run: bash scripts/inventory.sh update
        env:
          STAGE_STATUS: success
      - name: Mark failed
        if: failure()
        run: bash scripts/inventory.sh update
        env:
          STATUS: failed
          STAGE_STATUS: failed
      - name: Remove ephemeral identity
        if: always()
        run: rm -f "$RUNNER_TEMP/cf-key" "$RUNNER_TEMP/cf-key.pub" "$RUNNER_TEMP/cf-key-cert.pub" "$RUNNER_TEMP/cf-vars.json"

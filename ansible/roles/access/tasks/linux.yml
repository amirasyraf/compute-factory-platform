---
- name: Validate the bare team name
  ansible.builtin.assert:
    that: cf_team is match('^[a-z][a-z0-9-]*$')
    fail_msg: cf_team must be a bare group name, such as alpha.
- name: Create principal directory
  ansible.builtin.file:
    path: /etc/ssh/auth_principals
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Replace allowed principals with the owning team
  ansible.builtin.copy:
    dest: /etc/ssh/auth_principals/ubuntu
    content: "cf-automation\nteam-platform-admins\nteam-{{ cf_team }}\n"
    owner: root
    group: root
    mode: "0644"
- name: Validate SSH configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
- name: Reload SSH
  ansible.builtin.service:
    name: ssh
    state: reloaded
